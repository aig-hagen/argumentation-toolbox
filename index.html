<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgonProject</title>
    <meta name="description" content="Explore different approaches to formal argumentation." />
    <!-- Open Graph / social link previews (WhatsApp, Slack, iMessage, …). Crawlers don't
         run JS, so these must be static in the served HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgonProject" />
    <meta property="og:title" content="AgonProject" />
    <meta
      property="og:description"
      content="Explore different approaches to formal argumentation."
    />
    <meta property="og:image" content="/favicon-192x192.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AgonProject" />
    <meta
      name="twitter:description"
      content="Explore different approaches to formal argumentation."
    />
    <meta name="twitter:image" content="/favicon-192x192.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash while the app loads.
      let initialTheme = 'light'
      try {
        const preference = localStorage.getItem('vueuse-color-scheme') || 'system'
        initialTheme =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', initialTheme)
    </script>
    <style>
      /* First-paint background only, to avoid a flash before the palette
         (@/modules/common/theme/palette.ts) is injected. Keep in sync with
         base-100 there. */
      html {
        background-color: #ffffff;
      }
      html[data-theme='dark'] {
        background-color: #1c2833;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <link rel="stylesheet" href="/node_modules/@drgrice1/tikzjax/dist/fonts.css" />
    <script data-no-bundle src="/node_modules/@drgrice1/tikzjax/dist/tikzjax.js"></script>
    <div id="render-svg-container"></div>
  </body>
</html>
