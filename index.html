<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgonProject — Explore Formal Argumentation Online</title>
    <meta
      name="description"
      content="AgonProject is a free, interactive web platform for exploring formal argumentation: build, visualize, and evaluate abstract argumentation frameworks and related formalisms in your browser."
    />
    <link rel="canonical" href="https://agonproject.aig.fernuni-hagen.de/" />
    <!-- Open Graph / social link previews (WhatsApp, Slack, iMessage, …). Crawlers don't
         run JS, so these must be static in the served HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgonProject" />
    <meta property="og:url" content="https://agonproject.aig.fernuni-hagen.de/" />
    <meta property="og:title" content="AgonProject — Explore Formal Argumentation Online" />
    <meta
      property="og:description"
      content="A free, interactive web platform to build, visualize, and evaluate abstract argumentation frameworks and related formalisms in your browser."
    />
    <meta
      property="og:image"
      content="https://agonproject.aig.fernuni-hagen.de/favicon-192x192.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AgonProject — Explore Formal Argumentation Online" />
    <meta
      name="twitter:description"
      content="A free, interactive web platform to build, visualize, and evaluate abstract argumentation frameworks and related formalisms in your browser."
    />
    <meta
      name="twitter:image"
      content="https://agonproject.aig.fernuni-hagen.de/favicon-192x192.png"
    />
    <!-- Structured data so search engines get clean, explicit info instead of scraping UI text. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AgonProject",
        "url": "https://agonproject.aig.fernuni-hagen.de/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser)",
        "description": "A free, interactive web platform for exploring formal argumentation: build, visualize, and evaluate abstract argumentation frameworks and related formalisms in your browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "publisher": {
          "@type": "Organization",
          "name": "Artificial Intelligence Group, FernUniversität in Hagen",
          "url": "https://www.fernuni-hagen.de/aig/en/"
        }
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash while the app loads.
      let initialTheme = 'light'
      try {
        const preference = localStorage.getItem('vueuse-color-scheme') || 'system'
        initialTheme =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', initialTheme)
    </script>
    <style>
      /* First-paint background only, to avoid a flash before the palette
         (@/modules/common/theme/palette.ts) is injected. Keep in sync with
         base-100 there. */
      html {
        background-color: #ffffff;
      }
      html[data-theme='dark'] {
        background-color: #1c2833;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- tikzjax is loaded on demand (only for SVG export) in
         @/modules/common/export/renderSvg.ts, not eagerly here. -->
    <div id="render-svg-container"></div>
  </body>
</html>
