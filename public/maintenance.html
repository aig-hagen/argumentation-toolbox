<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Under maintenance &middot; AgonProject</title>
    <style>
      :root {
        color-scheme: light dark;
        /* Standalone page: values mirror @/modules/common/theme/palette.ts. */
        --bg: #eef2f6;
        --card: #ffffff;
        --fg: #162536;
        --muted: #526475;
        --border: #dce4ec;
        --accent: #004c97;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17222c;
          --card: #1c2833;
          --fg: #e7eef4;
          --muted: #9fb0bd;
          --border: #2a3a48;
          --accent: #7ea9ce;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        line-height: 1.55;
      }
      .card {
        width: 100%;
        max-width: 30rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0.35rem 0;
        color: var(--muted);
      }
      .brand {
        margin-top: 1.75rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .brand strong {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 data-i18n="heading">Temporarily unavailable</h1>
      <p data-i18n="body1">AgonProject is currently down for maintenance.</p>
      <p data-i18n="body2">
        We&rsquo;ll be back shortly &mdash; please check again in a little while.
      </p>
      <p class="brand"><strong>AgonProject</strong> &middot; AIG Hagen</p>
    </main>
    <!--
      Self-contained localization: this page ships as a static fallback served while the
      Vue app (and its locale bundles) is unavailable, so it cannot use vue-i18n. It mirrors
      the app's locale selection: the persisted `settings:locale` preference first, then the
      browser languages, then English.
    -->
    <script>
      ;(function () {
        var messages = {
          en: {
            title: 'Under maintenance · AgonProject',
            heading: 'Temporarily unavailable',
            body1: 'AgonProject is currently down for maintenance.',
            body2: 'We’ll be back shortly — please check again in a little while.',
          },
          de: {
            title: 'Wartungsarbeiten · AgonProject',
            heading: 'Vorübergehend nicht verfügbar',
            body1: 'AgonProject ist derzeit wegen Wartungsarbeiten offline.',
            body2: 'Wir sind bald wieder da — bitte schau in Kürze noch einmal vorbei.',
          },
        }

        function resolveLocale() {
          try {
            var stored = localStorage.getItem('settings:locale')
            if (stored === 'de' || stored === 'en') return stored
          } catch (e) {
            /* storage blocked (private mode etc.) — fall through to browser detection */
          }
          var langs = navigator.languages || [navigator.language || 'en']
          for (var i = 0; i < langs.length; i++) {
            var base = String(langs[i]).toLowerCase().split('-')[0]
            if (base === 'de') return 'de'
            if (base === 'en') return 'en'
          }
          return 'en'
        }

        var locale = resolveLocale()
        var t = messages[locale]
        document.documentElement.lang = locale
        document.title = t.title
        var nodes = document.querySelectorAll('[data-i18n]')
        for (var j = 0; j < nodes.length; j++) {
          nodes[j].textContent = t[nodes[j].getAttribute('data-i18n')]
        }
      })()
    </script>
  </body>
</html>
